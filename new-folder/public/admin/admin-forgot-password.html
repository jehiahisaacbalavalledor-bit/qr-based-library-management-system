<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Password Recovery | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="../user/css/login.css?v=2">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-card">
    <header class="login-header">
      <div class="admin-brand">ADMIN <span>PORTAL</span></div>
      <div class="campus-name">Cavite State University - Imus Campus</div>
      <div class="admin-badge">Staff &amp; Librarian Console</div>
      <h1 class="page-title">Staff Password Recovery</h1>
      <p class="page-subtitle">Requires an active Head Librarian session, or ask your Head Librarian to reset it in Staff Management.</p>
    </header>

    <form id="adminForgotPasswordForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="recoveryEmployeeId">Employee ID</label>
        <input type="text" id="recoveryEmployeeId" name="employeeId" placeholder="e.g. LIB-2024-001" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label for="recoveryAdminEmail">Institutional Email Address</label>
        <input type="email" id="recoveryAdminEmail" name="email" placeholder="name@cvsu.edu.ph" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="recoveryAdminNewPassword">New Password</label>
        <div class="password-box">
          <input type="password" id="recoveryAdminNewPassword" name="newPassword" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleAdminRecoveryPasswordBtn" aria-label="Toggle new password visibility">
            <svg id="eyeAdminRecoveryIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitAdminRecoveryBtn">Reset Staff Password</button>
    </form>

    <div class="bottom-links">
      <div>Remembered your password? <a href="../index.html">Back to Sign In</a></div>
    </div>
  </main>

  <script src="../assets/js/auth.js?v=4"></script>
</body>
</html>
