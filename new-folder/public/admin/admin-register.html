<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Account Registration | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="../user/css/style.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <style>
    .admin-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #0f172a;
      background: #f1f5f9;
      padding: 4px 14px;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
    }
    .admin-badge-pill svg { color: #00875a; }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <main class="auth-container">
    <div class="auth-card auth-card-wide">
      
      <!-- Card Header -->
      <header class="auth-header">
        <div class="logo-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42" role="img" aria-label="Admin Portal Logo">
            <g transform="translate(4, 2)">
              <rect x="11.5" y="11.5" width="15" height="15" rx="2" transform="rotate(45 19 19)" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" />
              <circle cx="19" cy="19" r="3" fill="#f59e0b" />
              <path d="M 13.5 13.5 L 6 6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="5" cy="5" r="2.2" fill="#f59e0b" />
              <path d="M 24.5 13.5 L 32 6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="33" cy="5" r="2.2" fill="#f59e0b" />
              <path d="M 13.5 24.5 L 6 32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="5" cy="33" r="2.2" fill="#f59e0b" />
              <path d="M 24.5 24.5 L 32 32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="33" cy="33" r="2.2" fill="#f59e0b" />
              <path d="M 19 8.5 L 19 3" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="19" cy="2" r="2" fill="#f59e0b" />
              <path d="M 19 29.5 L 19 35" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <circle cx="19" cy="36" r="2" fill="#f59e0b" />
            </g>
            <text x="48" y="18" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#00875a" letter-spacing="0.4">ADMIN</text>
            <text x="48" y="32" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#0f172a" letter-spacing="0.4">PORTAL</text>
          </svg>
        </div>
        <h1 class="campus-title">Cavite State University - Imus Campus</h1>
        <div class="admin-badge-pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Staff & Librarian Console
        </div>
        <hr class="header-divider">
        <h2 class="auth-section-title">Staff Account Registration</h2>
      </header>

      <!-- Account Registration Form -->
      <form id="adminRegisterForm" autocomplete="on" novalidate>
        
        <!-- Employee ID -->
        <div class="form-group">
          <label for="regEmployeeId" class="form-label">
            Employee / Staff ID <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="regEmployeeId" 
              name="employeeId" 
              class="form-control" 
              placeholder="e.g. LIB-2024-002" 
              required 
              autofocus
            >
          </div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label for="regFullName" class="form-label">
            Full Name <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="regFullName" 
              name="fullName" 
              class="form-control" 
              placeholder="e.g. Juanita R. Santos" 
              required
            >
          </div>
        </div>

        <!-- Institutional Email Address -->
        <div class="form-group">
          <label for="regAdminEmail" class="form-label">
            Institutional Email Address <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="regAdminEmail" 
              name="email" 
              class="form-control" 
              placeholder="name@cvsu.edu.ph" 
              required
            >
          </div>
        </div>

        <!-- Staff Designation Role -->
        <div class="form-group">
          <label for="regRole" class="form-label">
            Library Designation / Role <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <select id="regRole" name="role" class="form-control" style="background: #ffffff; cursor: pointer;">
              <option value="Circulation Desk Officer">Circulation Desk Officer</option>
              <option value="Head Librarian">Head Librarian</option>
              <option value="Cataloger">Cataloger & Inventory Specialist</option>
              <option value="System Administrator">Library Systems Administrator</option>
            </select>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="regAdminPassword" class="form-label">
            Password <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="regAdminPassword" 
              name="password" 
              class="form-control" 
              placeholder="Minimum 8 characters" 
              required
            >
            <button type="button" class="toggle-password" id="toggleRegAdminPasswordBtn" title="Toggle password visibility">
              <svg id="regAdminEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="regAdminConfirmPassword" class="form-label">
            Confirm Password <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="regAdminConfirmPassword" 
              name="confirmPassword" 
              class="form-control" 
              placeholder="Re-enter password" 
              required
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="adminRegisterSubmitBtn" style="background: #00875a;">
          Register Staff Account
        </button>

        <!-- Switch to Admin Sign In -->
        <div class="switch-auth-link">
          Already have a staff account? <a href="admin-index.html">Sign in here</a>
        </div>

      </form>

    </div>
  </main>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
