<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Account Registration | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="../user/css/login.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-card register-card">
    <header class="login-header">
      <div class="admin-brand">ADMIN <span>PORTAL</span></div>
      <div class="campus-name">Cavite State University - Imus Campus</div>
      <div class="admin-badge">Staff &amp; Librarian Console</div>
      <h1 class="page-title">Staff Account Registration</h1>
    </header>

    <form id="adminRegisterForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="regEmployeeId">Employee / Staff ID</label>
        <input type="text" id="regEmployeeId" name="employeeId" placeholder="e.g. LIB-2024-002" required autofocus>
      </div>

      <div class="form-group">
        <label for="regFullName">Full Name</label>
        <input type="text" id="regFullName" name="fullName" placeholder="e.g. Juanita R. Santos" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="regAdminEmail">Institutional Email Address</label>
        <input type="email" id="regAdminEmail" name="email" placeholder="name@cvsu.edu.ph" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="regRole">Library Role</label>
        <select id="regRole" name="role">
          <option value="Circulation Desk Officer">Circulation Desk Officer</option>
          <option value="Head Librarian">Head Librarian</option>
        </select>
      </div>

      <div class="form-group">
        <label for="regAdminPassword">Password</label>
        <div class="password-box">
          <input type="password" id="regAdminPassword" name="password" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleRegAdminPasswordBtn" aria-label="Toggle password visibility">
            <svg id="regAdminEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="regAdminConfirmPassword">Confirm Password</label>
        <input type="password" id="regAdminConfirmPassword" name="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
      </div>

      <div class="privacy-box">
        <label>
          <input type="checkbox" id="adminRegPrivacyConsent" required>
          <span><strong>Data Privacy &amp; Accountability Notice (RA 10173):</strong> I agree to safeguard patron circulation records and consent to logging staff actions for library security auditing.</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="adminRegisterSubmitBtn">Register Staff Account</button>
    </form>

    <div class="bottom-links">
      <div>Already have a staff account? <a href="../index.html">Sign in here</a></div>
    </div>
  </main>

  <script src="../assets/js/auth.js?v=3"></script>
</body>
</html>
