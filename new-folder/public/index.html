<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Student Portal | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="user/css/login.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-card">
    <header class="login-header">
      <img src="assets/images/logo.svg" alt="Student Portal Logo" class="login-logo">
      <h1 class="campus-name">Cavite State University - Imus Campus</h1>
    </header>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="studentNumber">Student Number</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"
          placeholder="Enter your student number"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-link">
        <a href="user/forgot-password.html">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
    </form>

    <div class="bottom-links">
      <div>Don't have an account? <a href="user/register.html">Register here</a></div>
    </div>
  </main>

  <script src="assets/js/auth.js?v=3"></script>
</body>
</html>
