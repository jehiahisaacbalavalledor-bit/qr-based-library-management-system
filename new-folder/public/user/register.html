<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Registration - Student Portal | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-card register-card">
    <header class="login-header">
      <img src="../assets/images/logo.svg" alt="Student Portal Logo" class="login-logo">
      <div class="campus-name">Cavite State University - Imus Campus</div>
      <h1 class="page-title">Student Account Registration</h1>
    </header>

    <form id="registerForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="regStudentNumber">Student Number</label>
        <input type="text" id="regStudentNumber" name="studentNumber" placeholder="e.g. 202610123" required autofocus>
      </div>

      <div class="form-group">
        <label for="regFullName">Full Name</label>
        <input type="text" id="regFullName" name="fullName" placeholder="e.g. Juan C. Dela Cruz" required autocomplete="name">
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="regCourse">Course / Program</label>
          <select id="regCourse" name="course" required>
            <option value="BS Information Technology">BS Information Technology</option>
            <option value="BS Computer Science">BS Computer Science</option>
            <option value="BS Business Management">BS Business Management</option>
            <option value="BS Hospitality Management">BS Hospitality Management</option>
            <option value="BS Office Administration">BS Office Administration</option>
            <option value="BS Secondary Education">BS Secondary Education</option>
            <option value="BS Psychology">BS Psychology</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regYearLevel">Year Level</label>
          <select id="regYearLevel" name="yearLevel" required>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" name="email" placeholder="name@cvsu.edu.ph" required autocomplete="email">
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="regMobile">Mobile Number</label>
          <input type="tel" id="regMobile" name="mobile" placeholder="09XXXXXXXXX" maxlength="11" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="regDob">Date of Birth</label>
          <input type="date" id="regDob" name="dob" min="1920-01-01" max="2026-12-31" required autocomplete="bday">
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="password-box">
          <input type="password" id="regPassword" name="password" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleRegPasswordBtn" aria-label="Toggle password visibility">
            <svg id="eyeRegIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="password-box">
          <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleRegConfirmPasswordBtn" aria-label="Toggle confirm password visibility">
            <svg id="eyeRegConfirmIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="privacy-box">
        <label>
          <input type="checkbox" id="regPrivacyConsent" required>
          <span><strong>Data Privacy Notice (RA 10173):</strong> I consent to the collection of my student details for CvSU Imus Library QR circulation and clearance verification.</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="submitRegBtn">Register</button>
    </form>

    <div class="bottom-links">
      <div>Already have an account? <a href="../index.html">Sign in here</a></div>
    </div>
  </main>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
