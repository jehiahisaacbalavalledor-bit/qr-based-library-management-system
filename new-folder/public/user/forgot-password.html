<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Student Portal | Cavite State University - Imus Campus</title>
  <link rel="stylesheet" href="css/login.css?v=2">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-card">
    <header class="login-header">
      <img src="../assets/images/logo.svg" alt="Student Portal Logo" class="login-logo">
      <div class="campus-name">Cavite State University - Imus Campus</div>
      <h1 class="page-title">Password Recovery</h1>
      <p class="page-subtitle">Enter your student number, email, and birth date to reset your password.</p>
    </header>

    <form id="forgotPasswordForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="recoveryStudentNumber">Student Number</label>
        <input type="text" id="recoveryStudentNumber" name="studentNumber" placeholder="Enter your student number" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label for="recoveryEmail">Registered Email Address</label>
        <input type="email" id="recoveryEmail" name="email" placeholder="name@cvsu.edu.ph" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="recoveryDob">Date of Birth</label>
        <input type="date" id="recoveryDob" name="dateOfBirth" min="1920-01-01" max="2026-12-31" required autocomplete="bday">
      </div>

      <div class="form-group">
        <label for="recoveryNewPassword">New Password</label>
        <div class="password-box">
          <input type="password" id="recoveryNewPassword" name="newPassword" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleRecoveryPasswordBtn" aria-label="Toggle new password visibility">
            <svg id="eyeRecoveryIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitRecoveryBtn">Reset Password</button>
    </form>

    <div class="bottom-links">
      <div>Remembered your password? <a href="../index.html">Sign in here</a></div>
    </div>
  </main>

  <script src="../assets/js/auth.js?v=4"></script>
</body>
</html>
